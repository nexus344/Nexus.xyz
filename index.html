<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hub - Official Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Kanit', sans-serif;
        }

        body {
            background-color: #0b0d14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* พื้นหลังเอฟเฟกต์แสงเรืองนวลๆ (Glowing Circles) */
        .bg-glow-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(0, 229, 255, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 10%;
            left: 20%;
        }

        .bg-glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(138, 43, 226, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            bottom: 10%;
            right: 20%;
        }

        /* Card หลักตรงกลาง */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(22, 26, 38, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .logo {
            font-size: 3em;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(135deg, #00e5ff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95em;
            margin-bottom: 25px;
        }

        /* โซนกล่องแสดง Loadstring */
        .code-box {
            background: #06080e;
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 12px;
            padding: 12px 15px;
            color: #00e5ff;
            font-family: monospace;
            font-size: 0.8em;
            word-break: break-all;
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        /* ปุ่มกดคัดลอก */
        .btn-copy {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00e5ff, #0088ff);
            color: #000;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
            margin-bottom: 12px;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 229, 255, 0.5);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        /* ปุ่ม Discord */
        .btn-discord {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #5865F2;
            color: #fff;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-discord:hover {
            background: #4752C4;
            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.8em;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <div class="logo">🚀</div>
        <h1>Nexus Hub</h1>
        <p>Official Roblox Scripting Site</p>

        <div class="code-box">
            loadstring(game:HttpGet("https://gist.githubusercontent.com/nexus344/a7545f97fc9aebda2a3d486a91be1627/raw/7cd49660016a76d07bc3537f2d851947494d8c65/18228"))()
        </div>

        <button class="btn-copy" onclick="copyScript()">📋 คัดลอก Loadstring</button>
        
        <a href="https://discord.gg" target="_blank" class="btn-discord">💬 Join Discord Server</a>

        <div class="footer-text">
            © 2026 Nexus Hub. All rights reserved.
        </div>
    </div>

    <script>
        function copyScript() {
            const scriptCode = 'loadstring(game:HttpGet("https://gist.githubusercontent.com/nexus344/a7545f97fc9aebda2a3d486a91be1627/raw/7cd49660016a76d07bc3537f2d851947494d8c65/18228"))()';
            navigator.clipboard.writeText(scriptCode);
            alert("คัดลอกสคริปต์ Nexus Hub เรียบร้อยแล้ว!");
        }
    </script>
</body>
</html>
